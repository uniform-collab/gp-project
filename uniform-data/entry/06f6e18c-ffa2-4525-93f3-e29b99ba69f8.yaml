              text: >-
                Yes. The GP PRO Customer Success Team runs onboarding for custodial staff and
                their supervisors, covering the KOLO® Clean app, how alerts are triaged, and
                how to route work across a shift. Sessions are built around how your team
                already operates rather than a generic curriculum, and refresher training is
                available as new staff join.
