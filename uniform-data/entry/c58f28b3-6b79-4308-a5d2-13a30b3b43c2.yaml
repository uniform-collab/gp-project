      value: >-
        Not only is Globe Life Field, home of the Texas Rangers, the newest
        Major League Baseball facility, it is also the first such facility to
        leverage GP PRO's KOLO™ Smart Monitoring System. The KOLO system helps
        keep restrooms clean, in working order, and fully stocked with toilet
        paper, paper towels, soap, and hand sanitizer.
