              text: >-
                Installation is designed to stay out of the building's way. Sensors fit KOLO®
                System compatible GP PRO dispensers already mounted on the wall, and the
                network transmits outbound only, so most deployments need no change to
                building IT or firewall policy. Your consultant confirms coverage first, then
                sequences the work restroom by restroom so no area is out of service for long.
