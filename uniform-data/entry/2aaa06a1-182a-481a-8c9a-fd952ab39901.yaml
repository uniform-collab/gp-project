              text: >-
                The KOLO® System is a full-stack IoT platform that connects GP PRO dispensers
                to the cloud using a blend of Bluetooth Low Energy (BLE) and LoRaWAN®
                technology. Dispensers send encrypted data—like usage, battery status, and
                maintenance needs—to secure cloud applications, where it's turned into
                actionable alerts and insights via mobile and web apps. The platform is
                designed for scalability, minimal infrastructure impact, and secure,
                outbound-only data transmission. 
