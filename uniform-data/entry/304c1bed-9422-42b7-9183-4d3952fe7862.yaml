    title:
      type: text
      value: >-
        Butlr Technologies and GP PRO Partner to Improve Hygiene, Labor
        Efficiency
    author:
      type: text
      value: GP PRO
    excerpt:
      type: text
      value: >-
        Butlr Technologies and GP PRO have formed a partnership that combines
        anonymous people-sensing insights with KOLO Smart Monitoring System to
        enable traffic-based cleaning and more efficient facility operations.
    bodyText:
      type: richText
      value:
        root:
          type: root
          version: 1
          children:
            - tag: h1
              type: heading
              version: 1
              children:
                - text: >-
                    Butlr Technologies and GP PRO Partner to Improve Hygiene,
                    Labor Efficiency
                  type: text
                  format: 0
                  version: 1
            - type: paragraph
              version: 1
              children:
                - text: >-
                    Butlr Technologies and GP PRO have announced a marketing
                    partnership focused on creating safer return-to-office
                    experiences and more effective restroom maintenance for
                    facilities.
                  type: text
                  format: 0
                  version: 1
            - type: paragraph
              version: 1
              children:
                - text: >-
                    Butlr, a spinout of the MIT Media Lab, provides a
                    people-sensing platform that uses thermal, wireless sensors
                    and artificial intelligence to detect human presence indoors
                    anonymously. The platform uses body heat to infer occupancy,
                    headcount, and activity, creating real-time and historical
                    insights without identifying individuals.
                  type: text
                  format: 0
                  version: 1
            - type: paragraph
              version: 1
              children:
                - text: >-
                    Combined with GP PRO’s KOLO Smart Monitoring System, these
                    insights can help facilities move from schedule-based
                    cleaning to traffic-based cleaning. Teams can better align
                    service with actual restroom demand, supporting hygiene
                    while reducing unnecessary labor and environmental impact.
                  type: text
                  format: 0
                  version: 1
            - type: paragraph
              version: 1
              children:
                - text: >-
                    The partnership brings together sensing and monitoring
                    capabilities to help facility managers understand changing
                    usage patterns and respond with more efficient operations.
                    It is intended to improve the customer experience while
                    helping teams maintain cleaner, better-stocked spaces.
                  type: text
                  format: 0
                  version: 1
            - type: paragraph
              version: 1
              children:
                - text: >-
                    The two companies expect the partnership to build awareness
                    of their complementary technologies and the benefits of
                    deploying them together.
                  type: text
                  format: 0
                  version: 1
  _locales:
