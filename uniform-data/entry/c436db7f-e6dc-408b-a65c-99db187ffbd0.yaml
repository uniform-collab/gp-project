      value: >-
        GP PRO’s KOLO Smart Monitoring System has earned GBAC STAR Registered
        Technology and Registered Program designation for supporting high
        standards of cleaning, disinfection, and infectious disease prevention.
    bodyText:
      type: richText
      value:
        root:
          type: root
          version: 1
          children:
            - tag: h1
              type: heading
              version: 1
              children:
                - text: KOLO Smart Monitoring System Earns GBAC STAR Designation
                  type: text
                  format: 0
                  version: 1
            - type: paragraph
              version: 1
              children:
                - text: >-
                    GP PRO’s KOLO Smart Monitoring System has earned GBAC STAR
                    Registered Technology and Registered Program designation.
                    The designation recognizes solutions that support rigorous
                    standards for cleaning, disinfection, and infectious disease
                    prevention.
                  type: text
                  format: 0
                  version: 1
            - type: paragraph
              version: 1
              children:
                - text: >-
                    GBAC STAR is the outbreak prevention, response, and recovery
                    accreditation program of the Global Biorisk Advisory
                    Council, a division of ISSA. Its registered technology and
                    program designations signal that a solution has been
                    evaluated against established hygiene and safety protocols.
                  type: text
                  format: 0
                  version: 1
            - type: paragraph
              version: 1
              children:
                - text: >-
                    KOLO is a wireless communication platform designed to help
                    facility managers and custodians respond when restrooms need
                    attention. Connected paper towel, tissue, and sanitizer
                    dispensers can send notifications about dispensing activity
                    and product levels, helping teams reduce outages and
                    maintain a better restroom experience.
                  type: text
                  format: 0
                  version: 1
            - type: paragraph
              version: 1
              children:
                - text: >-
                    The system can also notify teams about specific cleaning and
                    sanitizing work that needs to be completed. For facilities
                    navigating heightened hygiene expectations, this supports
                    more responsive operations and clearer visibility into
                    restroom conditions.
                  type: text
                  format: 0
                  version: 1
            - type: paragraph
              version: 1
              children:
                - text: >-
                    To earn the designation, the KOLO system demonstrated how it
                    supports cleaning efficacy, cost, health, and safety
                    requirements, including evidence of its role in helping
                    prevent the spread of infectious disease.
                  type: text
                  format: 0
                  version: 1
