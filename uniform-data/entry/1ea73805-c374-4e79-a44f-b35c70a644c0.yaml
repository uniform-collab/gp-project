            - mode: normal
              text: >-
                No. KOLO® sensors are built for low-power operation — they send small
                encrypted packets over Bluetooth Low Energy and LoRaWAN® rather than holding
                an always-on connection. Battery status for every dispenser is reported in the
                app alongside fill levels, so replacements are planned during a normal round
                instead of discovered when a dispenser goes quiet.
