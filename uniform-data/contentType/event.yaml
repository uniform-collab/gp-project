    typeConfig:
      elements:
        builtIn:
          - h1
          - h2
          - h3
          - h4
          - h5
          - h6
          - unorderedList
          - orderedList
          - link
          - quote
          - code
          - table
          - asset
          - variable
      required: false
      formatting:
        builtIn:
          - bold
          - italic
          - underline
          - strikethrough
          - code
          - superscript
          - subscript
      elementsConfig:
        asset:
          allowedTypes:
            - image
    localizable: true
    notLocalizedByDefault: true
  - id: link
    name: Link
    type: link
    guidance: >-
      Destination for the card button, usually an event page or registration
      URL.
    localizable: true
    notLocalizedByDefault: true
